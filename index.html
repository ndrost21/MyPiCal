<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Calendar Dashboard</title>
    <!-- Prevent Chromium Kiosk Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS Reference -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col p-4">
    
    <!-- Header: Clock on Left with Version Badge, Rotating Photo Banner Spanning Right -->
    <div class="flex items-center justify-between mb-4 gap-6 z-10">
        <div class="shrink-0">
            <div class="flex items-baseline gap-3">
                <h1 id="clock" class="text-6xl font-bold leading-none"></h1>
                <span id="version-badge" class="text-xs font-mono px-2 py-0.5 rounded-full border border-white/20 bg-white/5 text-muted font-semibold tracking-wider select-none shadow-sm">v1.2.4</span>
            </div>
            <h2 id="date" class="text-2xl text-muted mt-2"></h2>
        </div>
        
        <!-- Banner Container with Cross-fading Images -->
        <div id="banner-container" class="flex-grow h-24 overflow-hidden rounded-lg shadow-lg relative hidden" style="border: 1px solid var(--border-color);">
            <img id="banner-img-1" src="" alt="Header Photo 1" class="absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 opacity-0">
            <img id="banner-img-2" src="" alt="Header Photo 2" class="absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 opacity-0">
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="flex-grow flex flex-col grid-container rounded-lg overflow-hidden border shadow-xl z-10">
        <div class="grid-cols-7 header-row border-b text-center py-2 text-xs font-bold uppercase tracking-wider">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendar-grid" class="grid-cols-7 flex-grow"></div>
    </div>

    <!-- External JavaScript Reference -->
    <script src="script.js"></script>
</body>
</html>
