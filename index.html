<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Calendar Dashboard</title>
    <!-- Prevent Chromium Kiosk Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- External CSS Reference -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col p-4">
    
    <!-- Header: Clock on Left with Version Badge, Rotating Photo Banner Spanning Right -->
    <div class="flex items-center justify-between mb-4 gap-6 z-10">
        <div class="shrink-0">
            <div class="flex items-baseline gap-3">
                <h1 id="clock" class="text-6xl font-bold leading-none"></h1>
                <span id="version-badge" class="text-xs font-mono px-2 py-0.5 rounded-full border border-white/20 bg-white/5 text-muted font-semibold tracking-wider select-none shadow-sm">v1.3.1</span>
            </div>
            <h2 id="date" class="text-2xl text-muted mt-2"></h2>
        </div>
        
        <!-- Banner Container with Cross-fading Images -->
        <div id="banner-container" class="flex-grow h-24 overflow-hidden rounded-lg shadow-lg relative hidden" style="border: 1px solid var(--border-color);">
            <img id="banner-img-1" src="" alt="Header Photo 1" class="absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 opacity-0">
            <img id="banner-img-2" src="" alt="Header Photo 2" class="absolute inset-0 w-full h-full object-cover object-center transition-opacity duration-1000 opacity-0">
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="flex-grow flex flex-col grid-container rounded-lg overflow-hidden border shadow-xl z-10">
        <div class="grid-cols-7 header-row border-b text-center py-2 text-xs font-bold uppercase tracking-wider">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div id="calendar-grid" class="grid-cols-7 flex-grow"></div>
    </div>

    <!-- Sleep Summary & Weekly Trend Widget -->
    <div id="sleep-widget" class="mt-3 shrink-0 rounded-lg border shadow-lg px-5 py-2.5 z-10 hidden">
        <div class="flex items-center justify-between gap-8">
            <!-- Left Group: Current Night Score AND 7-Day Average Score Side-by-Side -->
            <div class="flex items-center gap-6 shrink-0">
                <!-- Current Night Sleep Score -->
                <div class="flex items-center gap-3">
                    <div id="sleep-score-ring" class="relative flex items-center justify-center w-12 h-12 rounded-full border-2 border-emerald-400 bg-white/5 font-bold shadow-md">
                        <span id="sleep-score-val" class="text-xl font-extrabold tracking-tight">--</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-muted">Last Night</span>
                            <span id="sleep-qualifier-badge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">--</span>
                        </div>
                        <div class="flex items-baseline gap-1.5 mt-0.5">
                            <span id="sleep-duration" class="text-base font-bold">--h --m</span>
                        </div>
                    </div>
                </div>

                <!-- Subtle Vertical Divider -->
                <div class="h-10 w-px bg-white/15"></div>

                <!-- 7-Day Average Score & Duration -->
                <div class="flex items-center gap-3">
                    <div id="sleep-avg-score-ring" class="relative flex items-center justify-center w-12 h-12 rounded-full border-2 border-amber-400 bg-white/5 font-bold shadow-md">
                        <span id="sleep-avg-score-val" class="text-xl font-extrabold tracking-tight">--</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-muted">7-Day Avg</span>
                            <span id="sleep-avg-qualifier-badge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">--</span>
                        </div>
                        <div class="flex items-baseline gap-1.5 mt-0.5">
                            <span id="sleep-avg-duration" class="text-base font-bold">--h</span>
                            <span class="text-[11px] text-muted">/ night</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Group: 7-Day Sleep Duration Graph -->
            <div class="flex-grow flex flex-col justify-center max-w-lg">
                <div class="text-[10px] font-semibold uppercase tracking-wider text-muted mb-1 px-1">7-Day Sleep Duration</div>
                <div id="sleep-graph-bars" class="flex items-end justify-between gap-3 h-12 px-1">
                    <!-- Populated dynamically via script.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript Reference -->
    <script src="script.js"></script>
</body>
</html>
